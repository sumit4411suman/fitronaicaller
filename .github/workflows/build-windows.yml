name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit, integration and UI tests (offscreen Qt, real backend subprocess)
        run: |
          python -m pytest tests/unit tests/integration tests/ui -q -p no:cacheprovider

      - name: Generate icons and bundled theme
        run: python scripts/build_windows.py --only icons --only theme

      - name: PyInstaller (portable folder)
        run: python -m PyInstaller --noconfirm --clean scripts/sellagent.spec

      - name: Smoke-run frozen backend
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SellAgent\sellagent-backend.exe -ArgumentList "--version" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "frozen backend --version failed" }

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Read app version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'apps/windows-desktop'); import sellagent_desktop; print(sellagent_desktop.APP_VERSION)"
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile installer (unsigned)
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=$env:APP_VERSION" scripts\installer.iss
          Get-ChildItem dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SellAgent-Setup-${{ env.APP_VERSION }}
          path: dist/SellAgent-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: SellAgent-portable-${{ env.APP_VERSION }}
          path: dist/SellAgent/
          if-no-files-found: error
