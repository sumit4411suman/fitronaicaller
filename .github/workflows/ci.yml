name: CI (backend, engines, protocol)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 ruff
      - name: Lint
        run: ruff check services packages tests
      - name: Unit + integration tests
        env:
          PYTHONPATH: services/local-backend;services/ai-engine;services/speech-engine;services/knowledge-base;packages/shared-protocol
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then export PYTHONPATH="services/local-backend:services/ai-engine:services/speech-engine:services/knowledge-base:packages/shared-protocol"; fi
          python -m pytest tests/unit tests/integration tests/e2e -q --junitxml=pytest-${{ matrix.os }}.xml
      - name: Protocol schema drift check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then export PYTHONPATH="packages/shared-protocol"; else export PYTHONPATH="packages/shared-protocol"; fi
          python -m sellagent_protocol.export_schema /tmp/schema_out
          diff -r /tmp/schema_out packages/shared-protocol/schema
      - name: Alembic upgrade/downgrade smoke
        shell: bash
        env:
          PYTHONPATH: services/local-backend:packages/shared-protocol
        run: |
          pip install alembic==1.20.0
          python - <<'PY'
          import os, sys
          sys.path[:0] = ["services/local-backend", "packages/shared-protocol"]
          from sellagent_backend.db import make_engine, migrate
          e = make_engine("ci_smoke.db"); migrate.upgrade(e); assert migrate.is_up_to_date(e); migrate.downgrade(e, "base"); migrate.upgrade(e); print("migrations ok")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.os }}
          path: pytest-*.xml
