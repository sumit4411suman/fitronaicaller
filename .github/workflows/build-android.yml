name: build-android

on:
  push:
    paths:
      - "apps/android-**"
      - "packages/shared-protocol/kotlin/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "apps/android-**"
      - "packages/shared-protocol/kotlin/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-sync:
    name: Protocol copies are identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: diff Protocol.kt copies
        run: |
          set -e
          SRC=packages/shared-protocol/kotlin/com/fitron/sellagent/protocol/Protocol.kt
          diff -u "$SRC" apps/android-companion/app/src/main/java/com/fitron/sellagent/protocol/Protocol.kt
          diff -u "$SRC" apps/android-audio-diagnostic/app/src/main/java/com/fitron/sellagent/protocol/Protocol.kt
          diff -u packages/brand/android/BrandTheme.kt apps/android-companion/app/src/main/java/com/fitron/sellagent/brand/BrandTheme.kt
          diff -u packages/brand/android/BrandTheme.kt apps/android-audio-diagnostic/app/src/main/java/com/fitron/sellagent/brand/BrandTheme.kt
          diff -u packages/brand/android/colors.xml apps/android-companion/app/src/main/res/values/colors.xml
          diff -u packages/brand/android/colors.xml apps/android-audio-diagnostic/app/src/main/res/values/colors.xml
          diff -ru apps/android-companion/app/src/main/java/com/fitron/sellagent/core apps/android-audio-diagnostic/app/src/main/java/com/fitron/sellagent/core

  build:
    name: assembleDebug (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: companion, dir: apps/android-companion, artifact: sellagent-companion-debug.apk }
          - { name: audiotest, dir: apps/android-audio-diagnostic, artifact: sellagent-audiotest-debug.apk }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        working-directory: ${{ matrix.app.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Rename APK
        working-directory: ${{ matrix.app.dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ matrix.app.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.dir }}/${{ matrix.app.artifact }}
          if-no-files-found: error
          retention-days: 30
